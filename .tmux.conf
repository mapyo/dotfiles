set -g mouse on

# コピー、選択モードのキーバインドvi風にする
set-window-option -g mode-keys vi

# Prefixをbからtへ移動
set-option -g prefix C-t

# ウィンドウの移動
# Prefix(ここではCtrl+t)を連続入力することでウィンドウを移動させます。
bind C-t next-window

# ペインのサイズ変更をvim風にする
# ＜Prefix＞＜Ctrl + { h | i | j | k }＞
# ＜Ctrl + { h | i | j | k }＞は連続して入力可能。
# 1回押すごとに5行(列)境界を移動させる。
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5

# ペインの移動1(Vim風にする)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# クリップボードをmacと連携
# ref. https://qiita.com/jyotti/items/5383d909f7307762fefa
set-option -g default-command "exec reattach-to-user-namespace -l $SHELL"
bind-key    -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key    -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# tmux上のvimでヤンク、コピーが出来るようにする
set-option -g default-command "reattach-to-user-namespace -l zsh"

# ウィンドウを(ペインに)分割
# ＜Prefix＞＜v＞、＜Prefix＞＜h＞と入力するだけで分割できるようにします。
# 新しくWindowを開くときにパスを維持する
# ref. http://qiita.com/omega999/items/aa99a9f24a93efe995c1
bind c new-window -c "#{pane_current_path}"
bind v split-window -hc "#{pane_current_path}"
bind s split-window -vc "#{pane_current_path}"

# アクティブペインは通常の背景、非アクティブは少し暗く
setw -g window-active-style bg=terminal
setw -g window-style        bg=colour238

# アクティブペインの境界線を目立たせる
set -g pane-border-style        fg=colour240
set -g pane-active-border-style fg=colour208
set -g pane-border-lines heavy

# ペイン上部にアクティブバナーを表示（誤爆防止のための一目瞭然化）
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverse]#[fg=colour208 bold] ▶ ACTIVE  P#{pane_index} #{pane_current_command}  #{b:pane_current_path} #[noreverse],#[fg=colour244]   idle    P#{pane_index} #{pane_current_command}  #{b:pane_current_path}}"

# display-panes（Prefix+q）を見やすく長めに
set -g display-panes-time 1500
set -g display-panes-active-colour colour208
set -g display-panes-colour        colour244

# Prefix押下中をステータスバーで明示
set -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}P#{pane_index}:#{pane_current_command} %H:%M"
